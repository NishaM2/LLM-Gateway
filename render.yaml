services:
  - type: web
    name: llm-gateway
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && cd client && npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: STATS_PUBLIC
        value: "true"
